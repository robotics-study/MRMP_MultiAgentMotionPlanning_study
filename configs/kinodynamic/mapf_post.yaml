# MAPF-POST (Hönig et al., ICAPS 2016): 계획이 아니라 스케줄을 만든다. 내부의 CBS가
# 이산 계획을 조용히 풀고, 그 위에 Temporal Plan Graph → STN을 풀어 각 셀 도착 시각과
# 안전 마커 시각을 확정한다. delta는 안전 마커가 셀 중심에서 떨어질 거리(칸 단위) —
# 논문 조건 l(e) > 2*delta를 l=1에서 만족하는 0 < delta <= 0.5만 허용하고, 0은
# 플래너가 거부한다(마커가 셀과 겹치면 안전 거리 보장이 사라진다). 데모 값 0.25는
# 모든 시나리오의 vmax(1, 1/2, 1/4)와 함께 시간이 이진 유리수가 되어 결과가 언어 간
# 비트 단위로 동일해진다. max_ct_expansions는 상속된 CBS 예산 그대로다.
algorithm: mapf_post
section: kinodynamic
# timed 시나리오만 — vmax 필드가 있어야 계획이 아니라 스케줄을 만든다.
scenarios: [open01_cross_timed, open01_swap_timed, pocket01_swap_timed, tee01_head_on_timed, corridor01_head_on_timed, maze01_two_timed]
params:
  - name: delta
    type: float
    default: 0.25
    min: 0.0
    max: 0.5
    description: >-
      Safety-marker distance in cells: every unit edge splits into delta, 1-2*delta,
      delta and each Type-2 precedence runs marker-to-marker, so agents keep graph
      distance >= 2*delta*v_min/v_max while executing (paper Theorem 2). The config
      range is inclusive but the planner rejects 0 — collapsed markers void the bound.
  - name: max_ct_expansions
    type: int
    default: 256
    min: 1
    description: >-
      Budget on the underlying CBS constraint-tree expansions (the root counts as
      the first) — inherited verbatim: an unsolvable instance still branches forever,
      and hitting this budget is what turns the silent base search off, which this
      planner reports honestly as "no plan to post-process".

# Prioritized A* (Erdmann & Lozano-Pérez 1987): agents are planned one at a time in
# index order; each plans unit-cost A* over space-time against earlier paths.
# No tunable parameters by design — the underlying single-agent search is plain
# optimal A* (unit costs, Manhattan heuristic) and priority order IS agent index.
algorithm: prioritized_astar
section: search
# 매트릭스 러너/웹 수출기가 이 알고리즘을 돌리는 시나리오 목록 (spec/param_schema.json).
# discrete 알고리즘이므로 셀 시나리오만 — discs 시나리오는 dRRT 영역이다.
scenarios: [maze01_two, open01_cross, open01_swap]
params: []

# Joint-space A* (the coupled baseline): one A* over the JOINT state — the tuple of
# all agent positions at once. No tunable parameters by design: unit costs, the
# sum-of-Manhattan heuristic, and FIFO tie-breaking are all fixed by the algorithm's
# definition, exactly like prioritized_astar.
algorithm: joint_astar
section: search
# 매트릭스 러너/웹 수출기가 이 알고리즘을 돌리는 시나리오 목록 (spec/param_schema.json).
# discrete 알고리즘이므로 셀 시나리오만 — discs 시나리오는 dRRT 영역이다.
scenarios: [maze01_two, open01_cross, open01_swap]
params: []

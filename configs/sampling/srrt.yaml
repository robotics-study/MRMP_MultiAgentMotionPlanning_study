# sRRT (Wagner, Kang & Choset 2012): subdimensional expansion over RRT. Each robot
# gets an individual policy (a BFS tree back from its goal on this grid); the joint
# tree grows forward, robots outside a node's collision set obey their policy, robots
# inside it are steered by samples. Like MA-RRT*, the PRNG seed is part of the
# algorithm's identity — every language replays the identical sample stream from it.
# goal_sampling_probability is NOT from the paper (it draws uniform joint samples
# only): it is this repo's informed-sampling convention, inherited from MA-RRT*'s
# §4.3/§4.4 goal biasing, and what makes the coupled regime reach the goal tuple at
# finite budget. max_iterations bounds the main loop ("until a configuration
# sufficiently close to the goal is added to the tree", made finite; sRRT has no
# anytime refinement to keep running for, so the loop stops the moment the goal
# becomes a vertex). No gamma and no c_max: sRRT has no near-ball radius, and its
# local walks terminate by strict Manhattan descent, not by a cost budget.
algorithm: srrt
section: sampling
# 매트릭스 러너/웹 수출기가 이 알고리즘을 돌리는 시나리오 목록 (spec/param_schema.json).
# discrete 알고리즘이므로 셀 시나리오만 — discs 시나리오는 dRRT 영역이다.
scenarios: [maze01_two, open01_cross, open01_swap]
params:
  - name: seed
    type: int
    default: 42
    min: 1
    max: 2147483646
    description: >-
      MINSTD Lehmer PRNG state (s ← 16807·s mod 2³¹−1). Fixed so every language
      engine replays byte-identical sample streams; the seed is part of a run's
      identity, not a tuning knob.
  - name: goal_sampling_probability
    type: float
    default: 0.5
    min: 0.0
    max: 1.0
    description: >-
      Probability of sampling the goal tuple outright instead of uniform random
      waypoints (the repo's informed-sampling convention, not the paper's — sRRT
      itself draws uniformly). 0.5 because these instances are sparse, matching
      MA-RRT*'s setting.
  - name: max_iterations
    type: int
    default: 2500
    min: 1
    description: >-
      Main-loop iterations ("until the goal becomes a vertex" made finite). The
      loop stops early the moment the goal tuple joins the tree; the budget is
      what turns an unproven guarantee into a run that ends. Generous on purpose:
      sparse scenarios converge in tens of expansions, and the headroom is what
      dense sandbox play (more agents, dragged endpoints) gets to spend before
      the honest "no solution found within budget" verdict.

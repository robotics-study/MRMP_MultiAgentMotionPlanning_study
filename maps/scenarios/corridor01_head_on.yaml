# 폭 1 통로 하나뿐인 맵에서 정면 swap 시나리오. Push and Swap에게 이 맵은 정직한
# 실패를 요구한다: swap primitive는 v와 w1의 이웃 w2, w4(2×2 블록)를 필요로 하는데
# 폭 1 통로는 어떤 셀도 이웃 둘이 서로 인접하지 않아(degree ≥ 3 vertex 없음) 교환
# 자리가 존재하지 않는다. n = |V|−2(빈 셀 2개) 조건을 만족해도 격자가 tree면 교환이
# 물리적으로 불가능하므로 알고리즘은 정직하게 실패를 보고한다 — 완전성 주장의 경계.
map: ../grid/corridor01.yaml   # scenario 파일 기준 상대 경로
agents:                        # agent 순서 = agent index (우선순위와 무관, 표시 순서)
  - start: [0.75, 0.75]        # cell (1, 1) — 오른쪽으로
    goal: [2.75, 0.75]         # cell (1, 5)
  - start: [2.75, 0.75]        # cell (1, 5) — 왼쪽으로
    goal: [0.75, 0.75]         # cell (1, 1)

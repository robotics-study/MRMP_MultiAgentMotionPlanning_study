# corridor01_head_on과 같은 정면 swap 시나리오, 다만 통로 위에 pocket(빈 셀 둘)이
# 하나 더 있다. {(0,3),(0,4),(1,3),(1,4)} 2×2 블록이 유일한 degree ≥ 3 교환 자리를
# 만들어 r과 s가 맞교환할 수 있고, 알고리즘은 swap으로 문제를 푼다 — 통로 하나가
# 완전성을 가르는 경계를 같은 좌표의 시나리오 쌍으로 보여준다.
map: ../grid/pocket01.yaml     # scenario 파일 기준 상대 경로
agents:                        # agent 순서 = agent index (우선순위와 무관, 표시 순서)
  - start: [0.75, 0.75]        # cell (1, 1) — 오른쪽으로
    goal: [2.75, 0.75]         # cell (1, 5)
  - start: [2.75, 0.75]        # cell (1, 5) — 왼쪽으로
    goal: [0.75, 0.75]         # cell (1, 1)

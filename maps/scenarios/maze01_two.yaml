# 폭 1 통로(row 2의 gap) 하나만으로 이어진 두 방. 반대편으로 가려면 둘 같은
# 통로를 반대 방향으로 지나야 한다 — 정면 충돌, 우선순위 시연용.
map: ../grid/maze01.yaml   # scenario 파일 기준 상대 경로
agents:                    # agent 순서 = agent index (우선순위와 무관, 표시 순서)
  - start: [0.75, 1.25]    # cell (17, 1) — 왼쪽 방 아래
    goal: [8.25, 7.25]     # cell (5, 16) — 오른쪽 방 위
  - start: [8.25, 1.25]    # cell (17, 16) — 오른쪽 방 아래
    goal: [0.75, 7.25]     # cell (5, 1) — 왼쪽 방 위

# open01_swap의 timed판: 같은 정면 스왑을 둘 다 v = 1칸/시간으로 지난다. 모든 type-2
# 제약이 여유롭고(공유 셀의 이산 도착 간격 ≥ 1 > 2*delta) 체인이 타이트하게 조여져
# 스케줄은 이산 계획의 시각을 그대로 재현한다 — makespan 16, 합 30은 CBS와 같은 숫자.
# 단위 속도가 곧 이산 스텝이라는 사실 자체가 이 갈래의 기준선이다.
map: ../grid/open01.yaml   # scenario 파일 기준 상대 경로
agents:                    # agent 순서 = agent index (우선순위와 무관, 표시 순서)
  - start: [1.25, 4.75]    # cell (10, 2) — 오른쪽으로
    goal: [8.25, 4.75]     # cell (10, 16)
    vmax: 1
  - start: [8.25, 4.75]    # cell (10, 16) — 왼쪽으로
    goal: [1.25, 4.75]     # cell (10, 2)
    vmax: 1

# maze01_two의 timed판: 같은 미로 교환을 v = 1과 v = 1/4로 지난다. 느린 agent(4시간에
# 한 칸)가 모든 공유 셀을 먼저 지나가야 하므로, 빠른 agent의 도착 시각은 느린 쪽이
# 지나는 시각+마커 여유만큼 뒤로 밀린다 — goal 도착이 이산 스텝 33에서 99.25로.
# makespan은 느린 쪽의 132(= 4 x 33), 합 231.25. 속도가 다르면 스케줄이 지배하는
# 쪽이 뒤집힌다는 것, 그리고 안전 마커가 실제로 조여지는 순간을 보여주는 시나리오.
map: ../grid/maze01.yaml   # scenario 파일 기준 상대 경로
agents:                    # agent 순서 = agent index (우선순위와 무관, 표시 순서)
  - start: [0.75, 1.25]    # cell (17, 1) — 왼쪽 방 아래, v = 1칸/시간
    goal: [8.25, 7.25]     # cell (5, 16) — 오른쪽 방 위
    vmax: 1
  - start: [8.25, 1.25]    # cell (17, 16) — 오른쪽 방 아래, v = 1/4칸/시간
    goal: [0.75, 7.25]     # cell (5, 1) — 왼쪽 방 위
    vmax: 0.25

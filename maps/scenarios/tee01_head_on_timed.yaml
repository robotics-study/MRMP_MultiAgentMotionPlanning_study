# tee01_head_on의 timed판: 같은 좌표·같은 요청을 둘 다 v = 1칸/시간으로 지난다.
# 다만 여기선 이산 계획의 대기가 통째로 스텝 하나를 쓰지 않아도 된다 — agent 1이
# (1,3)을 점유한 스텝과 agent 0의 도착 스텝 사이 간격이 정확히 1이라, 안전 마커
# 제약(2 + 0.25 + 0.25 = 2.5)이 이산 시각 3보다 세게 조여 도착이 2.5로 압축된다.
# makespan 6은 그대로지만 합은 11 → 10.5: 스텝 간격이 마커 여유보다 넉넉한 다른
# 스왑 시나리오와 달리, 여기선 연속 스케줄이 이산 계획보다 실제로 더 빠르다.
map: ../grid/tee01.yaml        # scenario 파일 기준 상대 경로
agents:                        # agent 순서 = agent index (우선순위와 무관, 표시 순서)
  - start: [0.75, 0.75]        # cell (1, 1) — 오른쪽으로
    goal: [2.75, 0.75]         # cell (1, 5)
    vmax: 1
  - start: [2.75, 0.75]        # cell (1, 5) — 왼쪽으로
    goal: [0.75, 0.75]         # cell (1, 1)
    vmax: 1

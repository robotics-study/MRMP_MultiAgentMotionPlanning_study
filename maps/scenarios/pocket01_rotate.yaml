# pocket01 위의 3-agent 시나리오 — rotate가 실제로 발동하는 쇼케이스. agent 0이 (1,5)에서
# (1,2)로 걷는 동안 agent 1을 pocket으로 밀어 넣고 먼저 도착해 주차하고, agent 1과 agent 2가
# 맞교환한 뒤(agent 1은 (1,3)→(1,1), agent 2는 (1,1)→(1,3)) 마지막 agent가 주차된 goal을 지날 때
# resolve된 agent들의 trail이 사이클을 이루고 rotate(캐스케이드 순환 이동)이 발동한다.
# Push and Swap은 같은 시나리오를 swap만으로 47 moves(21+16+10)에 풀지만 여기서는 rotate가
# 경로를 줄여 35 moves(15+10+10). agent index 순서(0,1,2 = (1,5),(1,3),(1,1))는 고정된
# 우선순위 순서이기도 하다 — 순서가 다르면 trace도 달라진다.
map: ../grid/pocket01.yaml     # scenario 파일 기준 상대 경로
agents:                        # agent 순서 = agent index (우선순위와 무관, 표시 순서)
  - start: [2.75, 0.75]        # cell (1, 5) — 왼쪽으로, goal은 통로 한가운데 (1, 2)
    goal: [1.25, 0.75]
  - start: [1.75, 0.75]        # cell (1, 3) — 왼쪽으로
    goal: [0.75, 0.75]         # cell (1, 1)
  - start: [0.75, 0.75]        # cell (1, 1) — 오른쪽으로
    goal: [1.75, 0.75]         # cell (1, 3)
